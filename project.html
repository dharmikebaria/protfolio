  document.getElementById('ogDesc').setAttribute('content', desc);
  document.getElementById('ogUrl').setAttribute('content', url);

}

    </div></section>`;

/* ---------- menu ---------- */
const menu = document.getElementById('menu'), menuToggle = document.getElementById('menuToggle');
const setMenu = (o) => { menu.classList.toggle('is-open', o); menuToggle.setAttribute('aria-expanded', o); menuToggle.setAttribute('aria-label', o ? 'Close menu' : 'Open menu'); };
menuToggle.addEventListener('click', (e) => { e.stopPropagation(); setMenu(!menu.classList.contains('is-open')); });
document.addEventListener('click', (e) => { if (!menu.contains(e.target)) setMenu(false); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setMenu(false); });

/* ---------- reveals ---------- */
const io = new IntersectionObserver((es) => es.forEach(e => { if (e.isIntersecting){ e.target.classList.add('is-visible'); io.unobserve(e.target); } }), { threshold:0.12, rootMargin:'0px 0px -6% 0px' });
document.querySelectorAll('[data-reveal]').forEach(el => io.observe(el));
